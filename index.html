<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search for a rental car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="search-card">
        <h2 class="card-title">Search for a rental car</h2>
        
        <form>
            <div class="mb-3">
                <label class="form-label">Pick up location</label>
                <input type="text" class="form-control" placeholder="City, airport, region, district...">
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="deliverCheckbox">
                <label class="form-check-label" for="deliverCheckbox">Deliver the car somewhere else</label>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">Date of pickup</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-regular fa-calendar-days"></i></span>
                        <input type="text" class="form-control" value="Sat 26 Mar 2022">
                    </div>
                </div>
                <div class="col-6">
                    <label class="form-label">Date of delivery</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-regular fa-calendar-days"></i></span>
                        <input type="text" class="form-control" value="Tue 29 Mar 2022">
                    </div>
                </div>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-3">
                    <select class="form-select">
                        <option selected>10</option>
                        <option>11</option>
                        <option>12</option>
                    </select>
                </div>
                <div class="col-3">
                    <select class="form-select">
                        <option selected>00</option>
                        <option>30</option>
                    </select>
                </div>
                <div class="col-3">
                    <select class="form-select">
                        <option selected>10</option>
                        <option>11</option>
                        <option>12</option>
                    </select>
                </div>
                <div class="col-3">
                    <select class="form-select">
                        <option selected>00</option>
                        <option>30</option>
                    </select>
                </div>
            </div>

            <div class="mb-3 form-check d-flex align-items-center">
                <input type="checkbox" class="form-check-input me-2" id="ageCheckbox" checked>
                <label class="form-check-label me-2" for="ageCheckbox">The driver's age between 30 and 65?</label>
                <i class="fa-regular fa-circle-question info-icon"></i>
            </div>

            <ul class="features-list">
                <li><i class="fa-solid fa-check"></i> No credit card fees</li>
                <li><i class="fa-solid fa-check"></i> No change fees</li>
                <li><i class="fa-solid fa-check"></i> Price match guarantee</li>
            </ul>

            <button type="submit" class="search-btn">Search</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
